name: Smoke (production)

# На продакшен идут только тесты @smoke: они ничего не создают в базе (ЛР12).
# Полные E2E (регистрация, товары, заявки) — только локально: npm run e2e.
# Когда запускается:
#  - после каждого успешного деплоя Vercel из main: Vercel сообщает о деплое статусом коммита
#    «Vercel» (событие status), а не через GitHub Deployments — поэтому не deployment_status;
#  - ежедневно в 04:00 UTC (09:00 в Астане) — заметить, что «уснула» база или API;
#  - кнопкой Run workflow
on:
  status:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  smoke:
    # Только продакшен (коммит в main). Preview-деплои веток закрыты входом Vercel
    # и не входят в CORS API — их не проверяем
    if: >-
      github.event_name != 'status' ||
      (github.event.context == 'Vercel' && github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:smoke
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
